workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - build

variables:
  CBSINIT_REPO: "https://github.com/Github-Aiko/cloudbase-init.git"
  CBSINIT_CONSTRAINTS_BASE_URL: "https://raw.githubusercontent.com/Github-Aiko/cloudbase-init/refs"
  PYTHON_VERSION: "3.14_6"
  PLATFORM: "x64"

build-windows-installer:
  stage: build
  tags:
    - windows
    - windows-shell
  timeout: 2h
  script:
    - |
      $ErrorActionPreference = "Stop"
      $sourceRef = if ($env:CI_COMMIT_TAG) { "tags/$($env:CI_COMMIT_TAG)" } else { "heads/master" }
      $sourceBranch = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "master" }
      $constraintsUrl = "$($env:CBSINIT_CONSTRAINTS_BASE_URL)/$sourceRef/upper-constraints.txt"

      & .\BuildAutomation\BuildCloudbaseInitSetup.ps1 `
          -ClonePullInstallerRepo:$false `
          -PythonVersion $env:PYTHON_VERSION `
          -Platform $env:PLATFORM `
          -VCVars "automatic" `
          -VSRedistDir "''" `
          -CloudbaseInitRepoUrl $env:CBSINIT_REPO `
          -CloudbaseInitRepoBranch $sourceBranch `
          -CloudbaseInitConstraintsUrl $constraintsUrl `
          -InstallOfficialPythonMsi:$true `
          -OfficialPythonMsiChecksum "C10234D0D9BD89F6F6DD55BAE28EDE0F97EE0DF4" `
          -RemovePythonPycs:$true `
          -InstallOfficialPythonUsingPyManager:$true
      if ($LASTEXITCODE -ne 0) {
          throw "Installer build failed with exit code $LASTEXITCODE."
      }

      $releaseDir = "CloudbaseInitSetup/bin/Release/$($env:PLATFORM)"
      $releaseFiles = @(
          "$releaseDir/XylentisCloudbaseInitSetup.msi",
          "$releaseDir/XylentisCloudbaseInitSetup.zip"
      )
      foreach ($file in $releaseFiles) {
          if (-not (Test-Path $file)) {
              throw "Missing build artifact: $file"
          }
      }
      Get-FileHash $releaseFiles -Algorithm SHA256 |
          ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
          Out-File -Encoding ascii "$releaseDir/SHA256SUMS.txt"
  artifacts:
    name: "XylentisCloudbaseInit-$CI_COMMIT_REF_SLUG-x64"
    expire_in: 30 days
    paths:
      - CloudbaseInitSetup/bin/Release/x64/XylentisCloudbaseInitSetup.msi
      - CloudbaseInitSetup/bin/Release/x64/XylentisCloudbaseInitSetup.zip
      - CloudbaseInitSetup/bin/Release/x64/SHA256SUMS.txt
